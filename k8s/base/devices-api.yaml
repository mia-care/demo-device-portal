apiVersion: apps/v1
kind: Deployment
metadata:
  name: devices-api
  labels:
    app.kubernetes.io/name: devices-api
    app.kubernetes.io/part-of: demo-device-portal
    app.kubernetes.io/component: backend
    mia-platform.eu/data-classification: confidential
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: devices-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devices-api
        app.kubernetes.io/part-of: demo-device-portal
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: devices-api
          image: ghcr.io/mia-care/demo-device-portal/devices-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: LOG_LEVEL
              value: info
          resources:
            requests: { cpu: "150m", memory: "192Mi" }
            limits: { cpu: "300m", memory: "384Mi" }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: devices-api
  labels:
    app.kubernetes.io/name: devices-api
    app.kubernetes.io/part-of: demo-device-portal
spec:
  selector:
    app.kubernetes.io/name: devices-api
  ports:
    - name: http
      port: 3001
      targetPort: http

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-portal
  labels:
    app.kubernetes.io/name: web-portal
    app.kubernetes.io/part-of: demo-device-portal
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-portal
        app.kubernetes.io/part-of: demo-device-portal
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-portal
          image: ghcr.io/mia-care/demo-device-portal/web-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BFF_BASE_URL
              value: http://bff:3000
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: web-portal
  labels:
    app.kubernetes.io/name: web-portal
    app.kubernetes.io/part-of: demo-device-portal
spec:
  selector:
    app.kubernetes.io/name: web-portal
  ports:
    - name: http
      port: 8080
      targetPort: http

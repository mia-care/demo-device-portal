# nginx config for serving the SPA as a non-root user on port 3000.
# pid and temp paths point at /tmp so nothing outside /tmp needs to be writable.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  sendfile      on;
  keepalive_timeout 65;

  server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx-served health endpoints for k8s probes.
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }
    location = /ready {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ready';
    }

    # Proxy API calls to the BFF service.
    location /api/ {
      proxy_pass http://bff:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
